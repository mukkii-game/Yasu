name: Publish to itch.io

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: itch
  cancel-in-progress: false

jobs:
  publish:
    # Publishes only an artifact authorized by the protected central workflow.
    uses: mukkii-game/ai-dev-infra/.github/workflows/publish-itch.yml@main
    with:
      itch_target: mukkii/yasu
    # Named explicitly. `secrets: inherit` would hand the called workflow every
    # secret this repository holds, not just the one it needs.
    secrets:
      butler_api_key: ${{ secrets.BUTLER_API_KEY }}
